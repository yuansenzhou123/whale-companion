<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鲸鲸 · 从聊天学到的表达偏好</title>
<style>body{margin:0;background:#f2f6ff;color:#344969;font:16px/1.7 system-ui,sans-serif}main{max-width:860px;margin:35px auto;padding:24px}h1{font-size:24px}a{color:#587fba}section,article{background:white;border:1px solid #dde5f4;border-radius:18px;padding:20px;margin:18px 0}button,select{border:1px solid #d5e1f3;border-radius:10px;padding:9px 14px;background:#edf3ff;color:inherit;cursor:pointer}blockquote{margin:12px 0;border-left:3px solid #c4d6f1;padding-left:14px;color:#75839a;white-space:pre-wrap}small{color:#75839a}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}#notice{min-height:28px;color:#6b80a1}</style>
<main><h1>从聊天学到的表达偏好</h1><p><a href="/persona">人设设置</a> · <a href="/relationship">相处与约会</a></p><section>你可以在微信聊天时直接指出喜欢或不喜欢的说法。鲸鲸会结合正在评价的那句话理解，保留具体偏好；新的纠正会更新旧要求。<br><small>原有人设完整保留。只有已认证主人的反馈会用于学习，普通聊天不会都当成风格要求。记录保存在本机。</small></section>
<div class="controls"><select id="owner" aria-label="选择主人"></select><label><input type="checkbox" id="enabled">从聊天中学习表达偏好</label><button id="undo">撤销最近一次学习</button><button id="clear">清空已学偏好</button></div><p id="notice"></p><div id="rules"></div></main>
<script>
let token='',ownerId='';const el=id=>document.getElementById(id),note=text=>el('notice').textContent=text;
async function api(route,body){const response=await fetch('/api/companion/'+route,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify({...body,ownerId})}:{})});const data=await response.json();if(!response.ok||!data.ok)throw Error(data.error||'暂时读取失败');return data;}
function render(data){el('enabled').checked=data.enabled;el('rules').replaceChildren();if(!data.rules.length){el('rules').textContent='还没有学到表达偏好，照常聊天就好。';return;}for(const row of data.rules){const card=document.createElement('article'),head=document.createElement('strong'),quote=document.createElement('blockquote'),time=document.createElement('small'),remove=document.createElement('button');head.textContent=({all:'通用',private:'私聊',group:'群聊'}[row.scope]||row.scope)+' · '+row.rule;quote.textContent='你的反馈：'+row.quote;time.textContent=new Date(row.ts).toLocaleString()+' ';remove.textContent='移除这条';remove.onclick=()=>update('style/remove',{id:row.id});card.append(head,quote);if(row.approved){const approved=document.createElement('blockquote');approved.textContent='你认可的实际回复：'+row.approved;card.append(approved);}card.append(time,remove);el('rules').append(card);}}
async function load(){if(!ownerId)return;try{render(await api('style?ownerId='+encodeURIComponent(ownerId)));note('');}catch(e){note(e.message);}}
async function update(route,body={}){try{render(await api(route,body));note('已保存');}catch(e){note(e.message);}}
el('enabled').onchange=()=>update('style/settings',{enabled:el('enabled').checked});el('owner').onchange=()=>{ownerId=el('owner').value;load();};el('undo').onclick=()=>update('style/undo');el('clear').onclick=()=>{if(confirm('清空从聊天学到的表达偏好？原有人设会保留。'))update('style/clear');};
(async()=>{try{const response=await fetch('/api/companion/bootstrap');const data=await response.json();if(!response.ok)throw Error(data.error||'请在本机打开');token=data.token;const state=await api('style');for(const item of state.owners||[]){const option=document.createElement('option');option.value=item.id;option.textContent=item.name;el('owner').append(option);}ownerId=el('owner').value;if(ownerId)await load();else note('先在人设设置中配置主人的真实微信 ID。');}catch(e){note(e.message);}})();
</script></html>
