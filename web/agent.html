<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鲸鲸 v3 · 自主任务</title>
<style>body{margin:0;background:#f1f5ff;color:#344867;font:16px/1.7 system-ui,sans-serif}main{max-width:960px;margin:30px auto;padding:24px}h1{font-size:25px}h2{font-size:19px}a{color:#6383b8}section,article{background:white;border:1px solid #dae4f4;border-radius:20px;padding:20px;margin:18px 0}button{border:0;border-radius:10px;padding:9px 15px;background:#e5edff;color:#344867;cursor:pointer}small{color:#8190a8}p,pre{white-space:pre-wrap;overflow-wrap:anywhere}pre{font:inherit}label{display:inline-block;margin-right:20px}#notice{color:#7388a6}</style>
<main><h1>鲸鲸 v3 · 自主任务</h1><p><a href="/persona">人设与学习</a> · <a href="/actions.html">实际执行记录</a> · <a href="/relationship">相处与约会</a></p><section><p id="status">正在读取…</p><label><input type="checkbox" id="running">允许自主行动</label><label><input type="checkbox" id="moments">允许自主发朋友圈</label><p><small>只有主人私聊能保存或撤销长期交代。她会按联系人真实账号检查后续消息。朋友圈在 10:00–22:00 自主判断，每天最多尝试 1 条，不需要逐条确认，也不每天凑一条。</small></p></section><p id="notice"></p><h2>记住的长期交代</h2><div id="policies"></div><h2>近期自主朋友圈</h2><div id="posts"></div><p><small>“排队”表示已作出决定；“已核实完成”才表示执行器确认实际发出。“仅草稿／结果待核实”不会自动重复发布。现有微信客户端的发表控件兼容性仍属实验功能。</small></p></main>
<script>
let token='',state;const el=id=>document.getElementById(id);async function api(route,body){const r=await fetch('/api/companion/'+route,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});const data=await r.json();if(!r.ok||!data.ok)throw Error(data.error||'读取失败');return data;}
async function load(){try{state=await api('agent');el('running').checked=state.enabled;el('moments').checked=state.momentsEnabled;el('status').textContent=(state.dryRun?'当前为预览，自动决策和实际发送均暂停。':'当前为实际执行模式。')+' 已识别联系人 '+state.contacts+' 位。';el('policies').replaceChildren();for(const row of state.policies){const card=document.createElement('article'),name=document.createElement('strong'),text=document.createElement('p'),button=document.createElement('button');name.textContent=row.target;text.textContent=row.instruction;button.textContent='撤销这条交代';button.onclick=()=>update('agent/revoke',{id:row.id});card.append(name,text,button);el('policies').append(card);}if(!state.policies.length)el('policies').textContent='还没有长期交代。像平常聊天一样，在微信私聊中告诉她何时、对谁、怎么回应即可。';el('posts').replaceChildren();for(const row of state.autonomy.decisions){const card=document.createElement('article'),head=document.createElement('strong'),text=document.createElement('pre'),reason=document.createElement('small');head.textContent=row.day+' · '+({queued:'等待执行',leased:'执行中',sent:'已核实完成',draft:'仅草稿',unknown:'结果待核实',simulated:'预演',expired:'已过期',cancelled:'已取消',reserved:'已保留尝试名额',failed:'未完成'}[row.status]||row.status);text.textContent=row.text;reason.textContent=row.reason;card.append(head,text,reason);el('posts').append(card);}if(!state.autonomy.decisions.length)el('posts').textContent='还没有自主发布决定。她会从当天的真实聊天与共同观看记录中选择合适的片段。';}catch(e){el('notice').textContent=e.message;}}
async function update(route,body){try{await api(route,body);await load();el('notice').textContent='已保存';}catch(e){el('notice').textContent=e.message;}}
el('running').onchange=()=>update('agent/pause',{paused:!el('running').checked});el('moments').onchange=()=>update('agent/moments',{enabled:el('moments').checked});
(async()=>{try{const b=await fetch('/api/companion/bootstrap').then(r=>r.json());token=b.token;await load();setInterval(load,10000);}catch(e){el('notice').textContent=e.message;}})();
</script></html>
